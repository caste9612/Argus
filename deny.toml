# cargo-deny: audit di licenze, advisory di sicurezza e provenienza delle
# dipendenze. Eseguito in CI (vedi .github/workflows/ci.yml).
#   cargo install cargo-deny && cargo deny check

[advisories]
version = 2
# Vulnerabilità note (RUSTSEC) e crate "yanked" → fallisci.
yanked = "deny"

[licenses]
version = 2
# Licenze permissive accettate. Argus è MIT; tutte le dipendenze (windows,
# eframe/egui, tracing, …) ricadono in questo insieme.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
# L'ecosistema windows-rs spesso porta più versioni dello stesso crate:
# è un avviso, non un errore (non vogliamo rompere la CI per questo).
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Solo crates.io: niente registry o git sconosciuti (supply-chain).
unknown-registry = "deny"
unknown-git = "deny"
