[package]
name = "argus"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Profiler portatile GPU-accelerato per Windows"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.29"
egui_plot = "0.29"

parking_lot = "0.12"
arc-swap = "1.7"
crossbeam-channel = "0.5"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

[dependencies.windows]
version = "0.58"
features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
]

[lints.clippy]
# No-panic policy (docs/06-reliability.md): vietato unwrap/expect/panic nel
# codice di produzione. Warn qui + `-D warnings` nel gate CI = errore di build.
# Il codice di test/fixture è esentato con #![allow(...)] mirati e commentati.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
