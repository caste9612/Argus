[package]
name = "argus"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Profiler portatile GPU-accelerato per Windows"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.29"
egui_plot = "0.29"

parking_lot = "0.12"
arc-swap = "1.7"
crossbeam-channel = "0.5"
regex = "1"          # ricerca nel flame graph; deps transitive già presenti

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

[dependencies.windows]
version = "0.58"
features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_System_Diagnostics_Debug", # DbgHelp: symbol resolution (Fase 2)
    "Win32_System_Diagnostics_Etw",   # ETW: sessione kernel + stack sample (Fase 2)
    "Win32_System_Diagnostics_ToolHelp", # snapshot thread del target (Fase 3)
    "Win32_System_Time",              # richiesto da OpenTraceW / EVENT_TRACE_LOGFILEW
    "Win32_Security",
]

[dev-dependencies]
# Per i test d'integrazione che creano il canale ETW (es. etw_live, admin-gated).
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
